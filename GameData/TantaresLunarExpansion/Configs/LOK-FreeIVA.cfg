// Tantares v28 renamed this inline parachute. FreeIVA 0.2.20.2 provides
// the through-node route for its old name only. Preserve the original part,
// chute operation and IVA geometry; extend the documented hollow-part route.
// Required between virgo_crew_s1_1 and virgo_orbital_module_s1_1 in LOK.
@PART[tantares_v2_parachute_s0_1]:HAS[!MODULE[ModuleFreeIva]]:NEEDS[Tantares,FreeIva]:AFTER[FreeIva]
{
	MODULE
	{
		name = ModuleFreeIva
		passThroughNodeA = bottom
		passThroughNodeB = top
	}
}
