// Tantares v28.0 + FreeIva 0.2.20.2. Clone AFTER upstream FreeIva patches
// so the pilot seat, instruments, side EVA hatch and modules are retained.
// Neither the original LK part nor its INTERNAL is edited by this package.
+INTERNAL[lk_v2_crew_s0p5_1_interior]:NEEDS[Tantares,FreeIva]:AFTER[FreeIva]
{
	@name = tle_lk_m_interior
	!MODEL,* {}
	MODEL
	{
		model = TantaresLunarExpansion/Models/lk_m_interior
	}
	MODEL
	{
		model = TantaresLunarExpansion/Models/lk_m_shell
	}
	// Personal-use copy of the Tantares IVA has a pre-cut roof aperture.
	// The collision shell also has its own pre-cut aperture; runtime Cut
	// alone cannot rebuild MeshColliders. Original dependency files stay intact.
	@MODULE[InternalModuleFreeIva]
	{
		%internalDepthMaskName =
		%externalDepthMaskName = mask
		%shellColliderName = shellCollider
		// An explicitly blank internalDepthMaskName disables automatic window
		// detection in FreeIVA. Register the actual renderer so glass receives
		// the correct depth-writing render order (and Deferred mask if used).
		%windowName = glass
	}
	PROP
	{
		name = tantares_prop_hatch
		position = 0, -0.14, -0.56
		rotation = 0, -0.707106829, -0.707106829, 0
		scale = 1, 1, 1
		MODULE
		{
			name = HatchConfig
			attachNodeId = top
		}
	}
}

+PART[lk_v2_crew_s0p5_1]:NEEDS[Tantares,FreeIva]:AFTER[FreeIva]
{
	@name = tle_lk_m_crew
	@author = Tantares / Tantares Lunar Expansion contributors
	@title = LK-M — Modernized Lunar Spacecraft
	@description = An alternate-history modernization of the single-seat LK lunar spacecraft. A short, broad pressure shoulder with the original cabin's insulation supports a Tantares size 0.5 APAS port. Its upper hatch allows a pilot to enter from LOK using FreeIVA. The original pilot station, instruments, windows and side EVA hatch are retained. Fit a Tantares Octans APAS-75 directly to the upper node.
	@tags = LK LK-M lunar lander moon mun soviet tantares freeiva docking transfer
	@entryCost = 4850
	@cost = 1170
	@mass = 0.525
	@CrewCapacity = 1
	@node_stack_top = 0, 0.61, 0.14, 0, 1, 0, 1
	!MODEL,* {}
	MODEL
	{
		model = TantaresLunarExpansion/Models/lk_m_exterior
	}
	@INTERNAL
	{
		@name = tle_lk_m_interior
	}
}

